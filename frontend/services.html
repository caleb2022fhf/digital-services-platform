
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Our Services | Digital Services</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #080d18;
            color: white;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 22px 8%;
            background: #101a2c;
            border-bottom: 1px solid #26344b;
        }

        .logo {
            color: #00d9ff;
            font-size: 24px;
            font-weight: bold;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-left: 20px;
        }

        nav a:hover {
            color: #00d9ff;
        }

        .intro {
            text-align: center;
            padding: 60px 20px 35px;
        }

        .intro h1 {
            font-size: 40px;
            margin-bottom: 15px;
        }

        .intro h1 span {
            color: #00d9ff;
        }

        .intro p {
            color: #b8c5d8;
            line-height: 1.7;
        }

        .services {
            padding: 30px 8% 70px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 25px;
        }

        .service-card {
            background: #111d30;
            border: 1px solid #263b57;
            padding: 30px 25px;
            border-radius: 14px;
            transition: 0.3s;
        }

        .service-card:hover {
            transform: translateY(-6px);
            border-color: #00d9ff;
        }

        .service-icon {
            font-size: 40px;
            margin-bottom: 20px;
        }

        .service-card h2 {
            color: #00d9ff;
            font-size: 22px;
            margin-bottom: 15px;
        }

        .service-card p {
            color: #b8c5d8;
            line-height: 1.7;
            margin-bottom: 22px;
        }

        .price {
            color: white;
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 20px;
        }

        .buy-button {
            display: block;
            text-align: center;
            padding: 13px;
            background: #00c9ed;
            color: #06111e;
            text-decoration: none;
            font-weight: bold;
            border-radius: 8px;
        }

        .buy-button:hover {
            background: #00a9cc;
        }

        .message {
            grid-column: 1 / -1;
            text-align: center;
            color: #b8c5d8;
            padding: 30px;
            line-height: 1.7;
        }

        footer {
            text-align: center;
            padding: 25px;
            background: #101a2c;
            color: #aab8cc;
        }

        @media (max-width: 600px) {
            header {
                flex-direction: column;
                gap: 18px;
            }

            .intro h1 {
                font-size: 32px;
            }
        }
    </style>
</head>

<body>

    <header>
        <div class="logo">Digital Services</div>

        <nav>
            <a href="index.html">Home</a>
            <a href="services.html">Services</a>
        </nav>
    </header>

    <section class="intro">
        <h1>Our <span>Digital Services</span></h1>
        <p>Choose the digital service you need.</p>
    </section>

    <section class="services" id="servicesList">
        <p class="message">Loading services...</p>
    </section>

    <footer>
        <p>&copy; 2026 Digital Services. All rights reserved.</p>
    </footer>

    <script>
        async function loadServices() {
            const container = document.getElementById("servicesList");

            try {
                const response = await fetch("/api/services");
                const result = await response.json();

                if (!response.ok || !result.success) {
                    throw new Error("Unable to load services.");
                }

                container.innerHTML = "";

                if (!result.services || result.services.length === 0) {
                    container.innerHTML =
                        '<p class="message">No services available yet. Please check again later.</p>';
                    return;
                }

                result.services.forEach(service => {
                    const card = document.createElement("div");
                    card.className = "service-card";

                    const icon = document.createElement("div");
                    icon.className = "service-icon";
                    icon.textContent = "💻";

                    const title = document.createElement("h2");
                    title.textContent = service.name;

                    const description = document.createElement("p");
                    description.textContent =
                        service.description || "Digital service available.";

                    const price = document.createElement("div");
                    price.className = "price";
                    price.textContent =
                        Number(service.price_rwf).toLocaleString("en-US") + " RWF";

                    const buyButton = document.createElement("a");
                    buyButton.className = "buy-button";
                    buyButton.textContent = "Buy Service";
                    buyButton.href =
                        "payment.html?service=" + encodeURIComponent(service.id);

                    card.appendChild(icon);
                    card.appendChild(title);
                    card.appendChild(description);
                    card.appendChild(price);
                    card.appendChild(buyButton);

                    container.appendChild(card);
                });

            } catch (error) {
                console.error("Services loading error:", error);

                container.innerHTML =
                    '<p class="message">Unable to load services. Please try again later.</p>';
            }
        }

        loadServices();
    </script>

</body>
</html>
