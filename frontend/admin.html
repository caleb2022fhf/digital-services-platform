
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Digital Services - Admin Login</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #080808;
    font-family: Arial, sans-serif;
    color: white;
    padding: 20px;
}

.login-box {
    width: 100%;
    max-width: 420px;
    background: #151515;
    border: 1px solid #292929;
    border-radius: 15px;
    padding: 35px;
    box-shadow: 0 0 25px rgba(0,255,255,0.08);
}

h1 {
    text-align: center;
    color: #00ffff;
    margin-bottom: 10px;
}

.subtitle {
    text-align: center;
    color: #aaa;
    margin-bottom: 30px;
}

label {
    display: block;
    margin-bottom: 8px;
    color: #ddd;
}

input {
    width: 100%;
    padding: 14px;
    margin-bottom: 20px;
    border: 1px solid #444;
    border-radius: 7px;
    background: #080808;
    color: white;
    outline: none;
}

input:focus {
    border-color: #00ffff;
}

button {
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: 7px;
    background: #00ffff;
    color: #000;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}

button:disabled {
    opacity: 0.5;
    cursor: not-allowed;
}

#message {
    text-align: center;
    margin-top: 18px;
    font-size: 14px;
    color: #ff7777;
    line-height: 1.5;
}
</style>
</head>

<body>

<div class="login-box">

    <h1>ADMIN LOGIN</h1>
    <p class="subtitle">Digital Services Dashboard</p>

    <form id="loginForm">

        <label for="email">Admin Email</label>
        <input
            type="email"
            id="email"
            placeholder="Enter admin email"
            required
        >

        <label for="password">Password</label>
        <input
            type="password"
            id="password"
            placeholder="Enter password"
            required
        >

        <button type="submit" id="loginButton">
            Login
        </button>

    </form>

    <p id="message"></p>

</div>

<script>
const SUPABASE_URL = "https://wewwtcamaymmtylzodxn.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
"sb_publishable_irQEjAWhLlqDoVZIJAhnzQ_hLyOa8Qv";

const supabaseClient = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
);

const loginForm = document.getElementById("loginForm");
const loginButton = document.getElementById("loginButton");
const message = document.getElementById("message");

loginForm.addEventListener("submit", async function(event) {
    event.preventDefault();

    message.textContent = "";
    loginButton.disabled = true;
    loginButton.textContent = "Checking...";

    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;

    try {
        const { data, error } =
            await supabaseClient.auth.signInWithPassword({
                email: email,
                password: password
            });

        if (error) {
            throw error;
        }

        const { data: admin, error: adminError } =
            await supabaseClient
                .from("admin_users")
                .select("role")
                .eq("user_id", data.user.id)
                .maybeSingle();

        if (adminError) {
            throw adminError;
        }

        if (!admin || admin.role !== "admin") {
            await supabaseClient.auth.signOut();
            throw new Error("Access denied. Admin account required.");
        }

        message.style.color = "#00ff88";
        message.textContent = "Verified! Opening dashboard...";

        loginButton.textContent = "Verified";

        window.location.replace("admin-dashboard.html");

    } catch (error) {

        message.style.color = "#ff7777";
        message.textContent =
            error.message || "Unable to login. Please try again.";

        loginButton.disabled = false;
        loginButton.textContent = "Login";
    }
});
</script>

</body>
</html>
